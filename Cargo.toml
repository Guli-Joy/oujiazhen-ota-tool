[package]
name = "ota-tool"
version = "1.0.2"
edition = "2021"
description = "欧加真全量包下载工具 —— OPPO / 一加 / 真我 全量包检索、下载与校验"
authors = ["Guli-Joy"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Guli-Joy/oujiazhen-ota-tool"
homepage = "https://github.com/Guli-Joy/oujiazhen-ota-tool"
readme = "README.md"
keywords = ["oppo", "realme", "oneplus", "ota", "firmware"]
categories = ["gui", "network-programming"]
exclude = ["docs/screenshot-main.png"]

[dependencies]
eframe = "0.37"
egui = "0.37"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
rsa = "0.9"
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
md-5 = "0.10"
rfd = "0.17"
open = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
