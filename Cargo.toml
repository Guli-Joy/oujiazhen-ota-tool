[package]
name = "ota-tool"
version = "1.0.0"
edition = "2021"
description = "OPPO / 真我 / 一加 全量包查询下载工具"

[dependencies]
eframe = "0.37"
egui = "0.37"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
rsa = "0.9"
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
md-5 = "0.10"
rfd = "0.17"
open = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
